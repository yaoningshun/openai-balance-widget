name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test without package restore
        shell: pwsh
        run: ./build.ps1 -Test
      - name: Checksums
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/Saldo.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Saldo.exe" | Set-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Saldo-Windows
          path: |
            dist/Saldo.exe
            dist/SHA256SUMS.txt
  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: windows
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Saldo-Windows
          path: dist
      - name: Publish tagged release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$env:GITHUB_REF_NAME" dist/Saldo.exe dist/SHA256SUMS.txt --generate-notes
